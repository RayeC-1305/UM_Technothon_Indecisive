<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveSense — Occupancy Dashboard</title>
    <style>
        /* ─── Dark Theme Variables ─── */
        :root {
            --bg-primary: #0f1117;
            --bg-card: #1a1d27;
            --bg-card-hover: #22263a;
            --border: #2a2e3d;
            --text-primary: #e4e4e7;
            --text-secondary: #888;
            --accent-green: #00d4aa;
            --accent-red: #ff4757;
            --accent-amber: #ffa502;
            --accent-blue: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ─── Header ─── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        header h1 span {
            color: var(--accent-green);
        }

        #connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        #connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
            transition: background 0.3s;
        }

        #connection-status.connected .dot {
            background: var(--accent-green);
        }

        /* ─── Tab Navigation ─── */
        .tabs {
            display: flex;
            gap: 0;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab:hover { color: var(--text-primary); }

        .tab.active {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        /* ─── Tab Content ─── */
        .tab-content {
            display: none;
            padding: 24px;
        }

        .tab-content.active { display: block; }

        /* ─── Status Cards Row ─── */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .status-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .status-card .label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .status-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            transition: color 0.3s;
        }

        /* ─── Status Badges ─── */
        .badge-occupied { color: var(--accent-green); }
        .badge-empty { color: var(--accent-red); }
        .badge-on { color: var(--accent-green); }
        .badge-off { color: var(--text-secondary); }
        .badge-active { color: var(--accent-amber); }
        .badge-triggered { color: var(--accent-blue); }
        .badge-standby { color: var(--text-secondary); }

        /* ─── Chart Container ─── */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            height: 350px;
        }

        .chart-container h3 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ─── Heatmap Table ─── */
        #heatmap h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        thead th {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tbody tr:last-child td { border-bottom: none; }

        /* Status cell colors */
        .status-clean {
            color: var(--accent-green);
            font-weight: 600;
        }

        .status-moderate {
            color: var(--accent-amber);
            font-weight: 600;
        }

        .status-dirty {
            color: var(--accent-red);
            font-weight: 600;
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .status-bar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Header ─── -->
    <header>
        <h1><span>Wave</span>Sense</h1>
        <div id="connection-status">
            <div class="dot"></div>
            <span id="connection-text">Connecting...</span>
        </div>
    </header>

    <!-- ─── Tab Navigation ─── -->
    <nav class="tabs">
        <button class="tab active" data-tab="live">Live View</button>
        <button class="tab" data-tab="heatmap">Janitorial Heatmap</button>
    </nav>

    <!-- ─── Live View Tab ─── -->
    <section id="live" class="tab-content active">
        <div class="status-bar">
            <div class="status-card">
                <span class="label">Room Status</span>
                <span class="value" id="occupancy-badge">--</span>
            </div>
            <div class="status-card">
                <span class="label">Relay (HVAC / Lights)</span>
                <span class="value" id="relay-badge">--</span>
            </div>
            <div class="status-card">
                <span class="label">Ghost Booking</span>
                <span class="value" id="ghost-countdown">--</span>
            </div>
        </div>
        <div class="chart-container">
            <h3>CSI Variance (Rolling Window)</h3>
            <canvas id="variance-chart"></canvas>
        </div>
    </section>

    <!-- ─── Janitorial Heatmap Tab ─── -->
    <section id="heatmap" class="tab-content">
        <h2>Operations — Room Usage</h2>
        <table>
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Session Time</th>
                    <th>Occupied Time</th>
                    <th>Usage Level</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="heatmap-body">
                <tr>
                    <td colspan="5" style="text-align:center; color: var(--text-secondary);">
                        Waiting for data...
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- ─── Chart.js from CDN ─── -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

    <script>
    /* ==========================================================
     *  WaveSense Dashboard — Client-Side Logic
     *  Uses SSE (Server-Sent Events) for real-time updates.
     * ========================================================== */

    // ─── Tab Switching ───
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    // ─── Chart.js Setup ───
    const ctx = document.getElementById('variance-chart').getContext('2d');
    const THRESHOLD = 5.0;

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'CSI Variance',
                    data: [],
                    borderColor: '#00d4aa',
                    backgroundColor: 'rgba(0, 212, 170, 0.08)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    borderWidth: 2
                },
                {
                    label: 'Occupancy Threshold',
                    data: [],
                    borderColor: '#ff4757',
                    borderDash: [8, 4],
                    pointRadius: 0,
                    borderWidth: 1,
                    fill: false
                }
            ]
        },
        options: {
            animation: false,  // Critical for real-time performance
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    display: true,
                    title: { display: true, text: 'Sample', color: '#666' },
                    ticks: { color: '#555', maxTicksLimit: 10 },
                    grid: { color: '#1e2130' }
                },
                y: {
                    beginAtZero: true,
                    title: { display: true, text: 'Variance', color: '#666' },
                    ticks: { color: '#555' },
                    grid: { color: '#1e2130' }
                }
            },
            plugins: {
                legend: {
                    labels: { color: '#999', usePointStyle: true, pointStyle: 'line' }
                }
            }
        }
    });

    // ─── Update Functions ───

    function updateChart(history) {
        if (!history || history.length === 0) return;

        const labels = history.map((_, i) => i);
        const thresholdData = history.map(() => THRESHOLD);

        chart.data.labels = labels;
        chart.data.datasets[0].data = history;
        chart.data.datasets[1].data = thresholdData;
        chart.update('none');
    }

    function updateOccupancy(occupied) {
        const badge = document.getElementById('occupancy-badge');
        if (occupied) {
            badge.textContent = 'Occupied';
            badge.className = 'value badge-occupied';
        } else {
            badge.textContent = 'Empty';
            badge.className = 'value badge-empty';
        }
    }

    function updateRelay(state) {
        const badge = document.getElementById('relay-badge');
        if (state) {
            badge.textContent = 'ON';
            badge.className = 'value badge-on';
        } else {
            badge.textContent = 'OFF';
            badge.className = 'value badge-off';
        }
    }

    function updateGhostBooking(ghost) {
        const el = document.getElementById('ghost-countdown');

        if (ghost.triggered) {
            el.textContent = `Cancelled (#${ghost.cancelled_count})`;
            el.className = 'value badge-triggered';
        } else if (ghost.active) {
            el.textContent = `Auto-cancel in ${ghost.countdown}s`;
            el.className = 'value badge-active';
        } else {
            el.textContent = 'Standby';
            el.className = 'value badge-standby';
        }
    }

    function updateHeatmap(heatmap) {
        const tbody = document.getElementById('heatmap-body');

        const sessionMin = Math.floor(heatmap.total_session_seconds / 60);
        const sessionSec = heatmap.total_session_seconds % 60;
        const sessionStr = `${sessionMin}:${String(sessionSec).padStart(2, '0')}`;

        const occMin = Math.floor(heatmap.occupied_seconds / 60);
        const occSec = heatmap.occupied_seconds % 60;
        const occStr = `${occMin}:${String(occSec).padStart(2, '0')}`;

        let statusClass = 'status-clean';
        let usageLevel = 'Low';
        if (heatmap.status === 'Moderate') {
            statusClass = 'status-moderate';
            usageLevel = 'Medium';
        } else if (heatmap.status === 'Dirty') {
            statusClass = 'status-dirty';
            usageLevel = 'High';
        }

        tbody.innerHTML = `
            <tr>
                <td>${heatmap.room}</td>
                <td>${sessionStr}</td>
                <td>${occStr}</td>
                <td>${usageLevel}</td>
                <td class="${statusClass}">${heatmap.status}</td>
            </tr>
        `;
    }

    function updateConnection(connected) {
        const el = document.getElementById('connection-status');
        const text = document.getElementById('connection-text');
        if (connected) {
            el.className = 'connected';
            text.textContent = 'Live';
        } else {
            el.className = '';
            text.textContent = 'No data';
        }
    }

    // ─── SSE Connection ───

    const evtSource = new EventSource('/api/stream');

    evtSource.onmessage = function(event) {
        try {
            const data = JSON.parse(event.data);
            updateChart(data.variance_history);
            updateOccupancy(data.occupied);
            updateRelay(data.relay_state);
            updateGhostBooking(data.ghost_booking);
            updateHeatmap(data.heatmap);
            updateConnection(data.connected);
        } catch (e) {
            console.error('SSE parse error:', e);
        }
    };

    evtSource.onerror = function() {
        document.getElementById('connection-status').className = '';
        document.getElementById('connection-text').textContent = 'Disconnected';
    };
    </script>
</body>
</html>
